name: Sync AI Jobs Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync Jobs
        run: |
          python fetch_jobs.py

      - name: Commit and Push Updated jobs.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync live AI jobs [skip ci]" && git push)
